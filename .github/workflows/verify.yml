name: Verify Blueprint Recruiting
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - run: npx --yes agent-browser@0.38.1 install --with-deps
      - run: npm run test:runtime
        env:
          BLUEPRINT_BROWSER_QA: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-workspace-browser
          path: .qa/*.png
          if-no-files-found: error
          include-hidden-files: true
